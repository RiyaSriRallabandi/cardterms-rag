services:
  db:
    image: pgvector/pgvector:pg17
    container_name: cardterms-db
    environment:
      POSTGRES_USER: cardterms
      POSTGRES_PASSWORD: cardterms
      POSTGRES_DB: cardterms
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardterms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: