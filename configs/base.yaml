# Default settings. Experiment configs override individual keys.

run_name: "base"

corpus:
  manifest_path: "data/corpus_manifest.csv"
  raw_dir: "data/corpus/raw"

chunking:
  strategy: "fixed"          # fixed | recursive | structure_aware | parent_doc
  chunk_tokens: 512
  overlap_pct: 0.0

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  query_prefix: ""           # some models require a prefix
  doc_prefix: ""
  batch_size: 32
  normalize: true

retrieval:
  mode: "dense"              # dense | bm25 | hybrid_rrf | hybrid_weighted
  top_k: 5
  candidate_pool: 20
  rrf_k: 60
  alpha: 0.5                 # only used by hybrid_weighted
  metadata_filter: false
  index_type: "exact"        # exact | hnsw
  ef_search: 40

reranking:
  enabled: false
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_n: 5

generation:
  provider: "ollama"         # ollama | groq | gemini
  model_name: "llama3.2:3b"
  prompt_version: "answer_v1"
  max_context_tokens: 3000
  temperature: 0.0
  context_order: "rank"      # rank | interleave

evaluation:
  golden_set_path: "data/eval/golden_set.jsonl"
  k_values: [1, 3, 5, 10, 20, 50]
  bootstrap_samples: 1000