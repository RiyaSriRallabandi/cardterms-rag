[project]
name = "cardterms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RiyaSriRallabandi", email = "rallabar@uci.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "tqdm>=4.70.0",
    "transformers>=5.14.1",
    "typer>=0.27.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
