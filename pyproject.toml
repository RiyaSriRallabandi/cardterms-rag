[project]
name = "cardterms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RiyaSriRallabandi", email = "rallabar@uci.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "typer>=0.27.1",
]

[project.scripts]
cardterms = "cardterms:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
